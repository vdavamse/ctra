name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lock:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          enable-cache: true
      - name: uv lock --check
        run: uv lock --check

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra api --dev
      - name: Run tests
        run: uv run --frozen pytest -q -p no:cacheprovider

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          python-version: "3.10"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra api --dev
      - name: ruff check
        run: uv run --frozen ruff check
      - name: ruff format --check
        run: uv run --frozen ruff format --check
      # Python 3.10 only: uv.lock forks pandas-stubs on python_full_version >= 3.11,
      # which causes 4 mypy errors (no-any-return). Never add mypy to the matrix legs.
      - name: mypy
        run: uv run --frozen mypy src/ctra scripts
