[project]
name = "ctra"
version = "0.1.0"
description = "Clinical Trial Risk Assessment — AutoCT-based prediction pipeline"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "CTRA Team"},
]

dependencies = [
    # LLM orchestration
    "dspy-ai>=3.0",
    # Classical ML
    "xgboost>=2.0",
    "shap>=0.44",
    "shapiq>=1.2",
    "scikit-learn>=1.4",
    # Data
    "polars>=1.0",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.12",
    # Experiment tracking
    "mlflow>=2.14",
    # Serialization
    "joblib>=1.3",
    # Utilities
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "diskcache>=5.6",
    # Entity resolution
    "pubchempy>=1.0.4",
    "dill>=0.3.7",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0",
    "spacy>=3.7",
    "python-igraph>=0.11",
    "gliner-spacy==0.0.10",  # 0.0.11 breaks doc.ents population
    "gliner>=0.2",
]
data = [
    "chembl-downloader>=0.4",
    # PyTDC excluded — pins pyarrow<=12.0.1 and scikit-learn==1.2.2
    # which conflict with our pyarrow>=15.0 and scikit-learn>=1.4.
    # Install separately: uv pip install PyTDC
]
tabpfn = [
    "tabpfn>=2.0",
    "tabpfn-extensions[interpretability]>=0.1",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
]
eval = [
    "datasets>=2.18,<3.0",  # bigbio uses loading scripts, removed in datasets 3.0
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
]
all = ["ctra[rag,tabpfn,api,dashboard,eval,dev]"]
# Note: 'data' extra excluded from 'all' because PyTDC pins pyarrow<=12.0.1
# which conflicts with pyarrow>=15.0. Install separately if needed.

[project.scripts]
ctra = "ctra.api.app:main"
ctra-dashboard = "ctra.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctra"]

[tool.uv]
required-version = ">=0.11"
# Pin litellm to exclude compromised versions (supply chain attack).
# See https://docs.litellm.ai/blog/security-update-march-2026
# Affected: 1.82.7, 1.82.8.  Safe: <=1.82.6.
constraint-dependencies = [
    "litellm>=1.0.0,!=1.82.7,!=1.82.8",
    # numba floor (issue #4).  shap 0.51.0 caps `numba<0.63` and `llvmlite<0.46`
    # on darwin-x86_64 -- those are the versions that dropped macOS-Intel wheels.
    # Every numba in that window also caps numpy (0.62.x -> <2.4, 0.61.x -> <2.3),
    # so the only candidate compatible with the fork's numpy 2.4.4 is numba 0.53.1:
    # 2021, requires-python >=3.6,<3.10, no wheels for any Python we support.  uv
    # unifies that darwin-x86_64 fork with the whole python_full_version >= '3.11'
    # branch, which is what breaks `uv sync` on 3.11/3.12.  This floor makes shap
    # 0.51.0 unsatisfiable on Intel Mac, so it falls back to shap 0.49.1 (which
    # caps neither) and numba 0.64.0, built from sdist.  Intel Mac is not a
    # supported dev platform.  No llvmlite floor is needed -- numba 0.61+ already
    # pins `llvmlite>=0.44.0dev0`, and an llvmlite floor alone does not fix #4.
    "numba>=0.61",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
    "types-tqdm>=4.66",
]

[tool.uv.sources]
# Biomedical spaCy NER model
en-core-sci-scibert = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_scibert-0.5.4.tar.gz" }

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# N802/N803/N806: ML convention uses uppercase X_train, X_val, X_test, etc.
"src/ctra/agents/orchestrator.py" = ["N803", "N806"]
"src/ctra/agents/initializer.py" = ["N803", "N806"]
"src/ctra/agents/feature_utils.py" = ["N802", "N803", "N806"]
"src/ctra/models/model_registry.py" = ["N803"]
"src/ctra/models/xgboost_classifier.py" = ["N803", "N806"]
"src/ctra/models/tabpfn_classifier.py" = ["N803", "N806"]
"src/ctra/mlops/retraining.py" = ["N806"]
"scripts/run_agent.py" = ["N806"]
# Diagnostic and benchmark scripts — tolerate debug-style code
"scripts/eval/*.py" = ["B007", "B905", "E741", "F541", "F841", "SIM102"]
"tests/test_agents/test_builder_validation.py" = ["N802", "N806"]
"tests/test_agents/test_orchestrator.py" = ["N802", "N806"]
"tests/test_models/test_model_registry.py" = ["N806"]
"tests/test_models/test_xgboost_wrapper.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["ctra"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# Exclude exploratory benchmarking / diagnostic scripts from strict typing.
# These are single-use scripts that import optional heavy deps (stanza, flair,
# ir_datasets) and aren't part of the production pipeline.
exclude = [
    "^scripts/eval/benchmark_",
    "^scripts/eval/diagnose_",
]

[[tool.mypy.overrides]]
module = [
    "dspy.*",
    "xgboost.*",
    "shap.*",
    "shapiq.*",
    "polars.*",
    "mlflow.*",
    "tabpfn.*",
    "tabpfn_extensions.*",
    "igraph.*",
    "spacy.*",
    "sentence_transformers.*",
    "streamlit.*",
    "plotly.*",
    "pubchempy.*",
    "chembl_downloader.*",
    "tdc.*",
    "gliner.*",
    "gliner_spacy.*",
    "sklearn.*",
    "scipy.*",
    "joblib.*",
    "dill.*",
    "torch.*",
    "diskcache.*",
    "datasets.*",
    "matplotlib.*",
    "seaborn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-ra",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
    "gpu: marks tests requiring GPU",
]
