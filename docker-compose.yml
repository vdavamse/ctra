services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./output:/app/output:ro
      - ./models:/app/models:ro
      - ./mlruns:/app/mlruns:ro
      - ./monitoring:/app/monitoring
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CTRA_API_HOST=0.0.0.0
      - CTRA_API_PORT=8000
      - CTRA_DEBUG=${CTRA_DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build: .
    command: ["python", "-m", "streamlit", "run", "/app/src/ctra/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - CTRA_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
